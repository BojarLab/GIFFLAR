seed: [42, 1234, 1337]
root_dir: /scratch/SCRATCH_SAS/roman/Gothenburg/GIFFLAR/data_final_small
logs_dir: /scratch/SCRATCH_SAS/roman/Gothenburg/GIFFLAR/logs_final_small
datasets:
  - name: Glycosylation
    task: classification
  - name: Tissue
    task: multilabel
  - name: Taxonomy_Kingdom
    task: multilabel
pre-transforms:
  GIFFLARTransform:
  GNNGLYTransform:
  ECFPTransform:
  SweetNetTransform:
  RGCNTransform:
  RandomWalkPE:
    dim: 20
    individual: False
  LaplacianPE:
    dim: 20
    individual: False
model:
  - name: sweetnet
    feat_dim: 128
    hidden_dim: 256
    batch_size: 256
    num_layers: 16
    epochs: 100
    patience: 30
    learning_rate: 0.001
    optimizer: Adam
    suffix:
  - name: gnngly
    feat_dim: 128
    hidden_dim: 256
    batch_size: 256
    num_layers: 8
    epochs: 100
    patience: 30
    learning_rate: 0.001
    optimizer: Adam
    suffix:
  - name: rgcn
    feat_dim: 128
    hidden_dim: 256
    batch_size: 64
    num_layers: 8
    epochs: 100
    learning_rate: 0.001
    optimizer: Adam
    suffix:
  - name: gifflar
    feat_dim: 128
    hidden_dim: 256
    batch_size: 128
    num_layers: 8
    epochs: 100
    learning_rate: 0.001
    optimizer: Adam
    pooling: global_mean
    suffix:
