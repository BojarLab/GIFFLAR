origin: /scratch/chair_kalinina/s8rojoer/GIFFLAR/data_new_256/lgi_random_150k.csv
pre-transforms:
  GIFFLARTransform:
  GNNGLYTransform:
  ECFPTransform:
  SweetNetTransform:
model:
  glycan_encoder:
    - name: mlp
      feat_dim: 1024
      hidden_dim: 1024
      output_dim: 1024
